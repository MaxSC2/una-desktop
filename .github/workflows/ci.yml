name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: postinstall runs `electron-builder install-app-deps` ->
      # source build of better-sqlite3 via node-gyp, which fails on windows-latest
      # (image ships VS 18, node-gyp 9.x cannot detect it). No CI job executes
      # native modules or the electron binary, so lifecycle scripts are skipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run check

  typecheck:
    name: Type Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # See lint job: lifecycle scripts skipped (native better-sqlite3 build
      # is not needed for type checking and breaks on the current runner image).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check electron
        run: npx tsc -p electron/tsconfig.json

      - name: Type check src
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: windows-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # See lint job: lifecycle scripts skipped (native better-sqlite3 build
      # is not needed for vite/tsc build and breaks on the current runner image).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload dist-electron
        uses: actions/upload-artifact@v4
        with:
          name: dist-electron
          path: dist-electron/
          retention-days: 7
